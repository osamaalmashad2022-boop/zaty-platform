<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="og-bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#02241D" />
      <stop offset="45%" stop-color="#05382F" />
      <stop offset="100%" stop-color="#0B1C18" />
    </linearGradient>

    <radialGradient id="og-glow" cx="600" cy="315" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D2B2" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#006E5A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <filter id="og-card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <linearGradient id="emblem-teal" x1="120" y1="40" x2="40" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5C0" />
      <stop offset="35%" stop-color="#00A887" />
      <stop offset="80%" stop-color="#006E5A" />
      <stop offset="100%" stop-color="#094A3D" />
    </linearGradient>

    <linearGradient id="emblem-sheen" x1="112" y1="56" x2="148" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#67FCE4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="spark-gold-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="40%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#E14B63" />
    </linearGradient>

    <filter id="spark-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FF7A59" flood-opacity="0.6" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#og-bg)" />
  <rect width="1200" height="630" fill="url(#og-glow)" />

  <!-- Subtle grid lines -->
  <path d="M 0 80 H 1200 M 0 160 H 1200 M 0 240 H 1200 M 0 320 H 1200 M 0 400 H 1200 M 0 480 H 1200 M 0 560 H 1200" 
        stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 80 0 V 630 M 160 0 V 630 M 240 0 V 630 M 320 0 V 630 M 400 0 V 630 M 480 0 V 630 M 560 0 V 630 M 640 0 V 630 M 720 0 V 630 M 800 0 V 630 M 880 0 V 630 M 960 0 V 630 M 1040 0 V 630 M 1120 0 V 630" 
        stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />

  <!-- Center Card (WhatsApp Safe Zone 600x600 in center) -->
  <g filter="url(#og-card-shadow)">
    <rect x="270" y="65" width="660" height="500" rx="28" 
          fill="#062F27" fill-opacity="0.85" 
          stroke="#00E5C0" stroke-opacity="0.35" stroke-width="1.5" />

    <!-- Center Emblem -->
    <g transform="translate(548, 90)">
      <circle cx="52" cy="55" r="38" fill="#00D2B2" fill-opacity="0.12" />

      <!-- Single ribbon 'ذ' -->
      <g transform="scale(0.55)">
        <path d="M 112 56
                 C 120 56 128 62 131 72
                 C 137 92 144 114 148 126
                 C 151 135 146 142 136 143
                 L 58 143
                 C 44 143 38 131 46 122
                 C 48 120 54 117 62 117
                 L 122 117
                 C 124 117 125 115 124 112
                 L 106 72
                 C 103 64 106 56 112 56 Z"
              fill="url(#emblem-teal)" />

        <path d="M 112 58 C 122 60 130 68 133 76 C 139 96 146 116 148 126"
              stroke="url(#emblem-sheen)"
              stroke-width="2.5"
              stroke-linecap="round" />

        <!-- AI Spark -->
        <g transform="translate(114, 32)" filter="url(#spark-glow)">
          <path d="M 0 -22
                   C 1.5 -7 7 -1.5 22 0
                   C 7 1.5 1.5 7 0 22
                   C -1.5 7 -7 1.5 -22 0
                   C -7 -1.5 -1.5 -7 0 -22 Z"
                fill="url(#spark-gold-coral)" />
          <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
        </g>

        <!-- Micro Spark -->
        <g transform="translate(156, 88) scale(0.4)">
          <path d="M 0 -18 C 1 -5 5 -1 18 0 C 5 1 1 5 0 18 C -1 5 -5 1 -18 0 C -5 -1 -1 -5 0 -18 Z"
                fill="#00E5C0"
                fill-opacity="0.85" />
        </g>
      </g>
    </g>

    <!-- Typography -->
    <!-- Brand Title: ذاتي Zaty -->
    <text x="560" y="275" 
          font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" 
          font-size="52" 
          font-weight="800" 
          text-anchor="end" 
          fill="#FFFFFF">ذاتي</text>

    <!-- Badge ZATY -->
    <g transform="translate(580, 240)">
      <rect x="0" y="0" width="72" height="32" rx="8" fill="#103832" stroke="#00E5C0" stroke-opacity="0.4" stroke-width="1" />
      <text x="36" y="21" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#00E5C0">ZATY</text>
    </g>

    <!-- Tagline -->
    <text x="600" y="330" 
          font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" 
          font-size="24" 
          font-weight="700" 
          text-anchor="middle" 
          fill="#34F5D7">منصة التعلّم الذاتي التفاعلي</text>

    <!-- Subtext -->
    <text x="600" y="375" 
          font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif" 
          font-size="17" 
          font-weight="500" 
          text-anchor="middle" 
          fill="#D1EAE5">الشهادة الإعدادية · بايثون، ذكاء اصطناعي وأمن سيبراني</text>

    <!-- Badges Row -->
    <g transform="translate(365, 420)">
      <!-- Badge 1: بدون إنترنت -->
      <rect x="320" y="0" width="145" height="42" rx="10" fill="#0E4238" stroke="#00D2B2" stroke-width="1.2" />
      <text x="392" y="26" font-family="'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#00E5C0">⚡ بدون إنترنت</text>

      <!-- Badge 2: تشغيل بايثون -->
      <rect x="160" y="0" width="145" height="42" rx="10" fill="#0E4238" stroke="#00D2B2" stroke-width="1.2" />
      <text x="232" y="26" font-family="'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#00E5C0">🐍 تشغيل بايثون</text>

      <!-- Badge 3: مجاني بالكامل -->
      <rect x="0" y="0" width="145" height="42" rx="10" fill="#0E4238" stroke="#00D2B2" stroke-width="1.2" />
      <text x="72" y="26" font-family="'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#00E5C0">🎯 مجاني بالكامل</text>
    </g>
  </g>
</svg>
